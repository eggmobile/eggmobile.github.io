---
layout: default
---

<h1>{{ page.title }}</h1>

<ul>
  {% for post in site.posts %}
  <li>

    {% if post.thumbnail %}
    <img src="{{ post.thumbnail }}">
    {% endif %}

    <a href="{{ post.url }}">
      <strong>{{ post.title }}</strong>
    </a><br>

    <small>{{ post.date | date: "%Y-%m-%d" }}</small>
  </li>
  {% endfor %}
</ul>
